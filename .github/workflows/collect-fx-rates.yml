name: Collect FX Rates

on:
  schedule:
    # Primary: 05:07 Europe/Zurich
    # MEZ (UTC+1, winter): 04:07 UTC
    - cron: '7 4 * * *'
    # MESZ (UTC+2, summer): 03:07 UTC
    - cron: '7 3 * * *'
    # Fallback: 05:52 Europe/Zurich (~45 min later) -- GitHub's `schedule`
    # trigger is not guaranteed to fire on time and can be delayed by hours
    # or skipped entirely under load; this catches that case most mornings.
    # collect_fx_rates.py is idempotent (overwrites same-day rows), so a
    # double run on a normal morning is harmless.
    # MEZ (UTC+1, winter): 04:52 UTC
    - cron: '52 4 * * *'
    # MESZ (UTC+2, summer): 03:52 UTC
    - cron: '52 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run FX rate collector
        run: python scripts/collect_fx_rates.py fx_rates.csv

      - name: Commit FX rate log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fx_rates.csv
          git diff --quiet --cached || git commit -m "Update fx_rates.csv"
          git push
