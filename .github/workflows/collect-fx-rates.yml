name: Collect FX Rates

on:
  schedule:
    # 06:07 Europe/Zurich
    # MEZ (UTC+1, winter): 05:07 UTC
    - cron: '7 5 * * *'
    # MESZ (UTC+2, summer): 04:07 UTC
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run FX rate collector
        run: python scripts/collect_fx_rates.py fx_rates.csv

      - name: Commit FX rate log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fx_rates.csv
          git diff --quiet --cached || git commit -m "Update fx_rates.csv"
          git push
